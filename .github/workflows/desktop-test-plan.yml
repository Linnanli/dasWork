name: Desktop test-plan gate

on:
  pull_request:
    paths:
      - "desktop-app/**"
      - ".omx/plans/codex-app-tools-presentations-remaining-gaps-remediation-plan.md"
      - "codex/codex-rs/app-server/**"
      - "docs/test-plan.md"
      - ".github/workflows/desktop-release.yml"
      - ".github/workflows/desktop-test-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-test-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop-app

      - name: Use locked Codex CLI
        shell: bash
        run: |
          echo "$GITHUB_WORKSPACE/desktop-app/node_modules/.bin" >> "$GITHUB_PATH"
          node desktop-app/scripts/verify-pinned-codex-cli.mjs

      - name: Build AI-free Codex app-server client
        run: npm run build:codex-app-server-client
        working-directory: desktop-app

      - name: Verify generated Codex app-server protocol contract
        run: npm run verify:codex-app-server-protocol-contract
        working-directory: desktop-app

      - name: Smoke-test real Codex app-server contract
        run: npm run verify:real-codex-app-server-contract
        working-directory: desktop-app

      - name: Verify native Codex runtime boundaries
        shell: bash
        working-directory: desktop-app
        run: |
          set -o pipefail
          mkdir -p test-results/contracts
          node scripts/verify-codex-native-runtime-boundaries.mjs | tee test-results/contracts/native-runtime-boundaries.json

      - name: Verify App Tools release-gate contract
        run: npm run verify:app-tools-release-gates
        working-directory: desktop-app

      - name: Upload native runtime boundary report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-runtime-boundaries
          if-no-files-found: warn
          path: desktop-app/test-results/contracts/native-runtime-boundaries.json

      - name: AI-free client lint, typecheck, and tests
        run: npm --prefix vendors/codex-app-server-client run qa
        working-directory: desktop-app

      - name: Desktop lint, typecheck, and tests
        working-directory: desktop-app
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Verify test-plan coverage contract
        run: xvfb-run --auto-servernum npm --prefix desktop-app run test:plan-coverage

      - name: Run Mock E2E
        run: xvfb-run --auto-servernum npm --prefix desktop-app run test:e2e -- --reporter=line

      - name: Run packaged smoke
        run: xvfb-run --auto-servernum npm --prefix desktop-app run test:e2e:packaged

      - name: Run release LLM E2E
        env:
          DASCOWORK_RELEASE_LLM_SMOKE: ${{ secrets.DASCOWORK_RELEASE_LLM_SMOKE }}
          DASCOWORK_RELEASE_ADMIN_BACKEND_URL: ${{ secrets.DASCOWORK_RELEASE_ADMIN_BACKEND_URL }}
          DASCOWORK_RELEASE_ADMIN_BACKEND_USER_ID: ${{ secrets.DASCOWORK_RELEASE_ADMIN_BACKEND_USER_ID }}
          DASCOWORK_RELEASE_EXTERNAL_RETRY: ${{ secrets.DASCOWORK_RELEASE_EXTERNAL_RETRY }}
        run: xvfb-run --auto-servernum npm --prefix desktop-app run test:e2e:release-llm

      - name: Repeat abnormal Mock E2E
        run: xvfb-run --auto-servernum npm --prefix desktop-app run test:e2e:stability

      - name: Check change scope
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$(git merge-base HEAD "origin/$GITHUB_BASE_REF")"
          else
            base="$(git rev-parse HEAD^)"
          fi
          git diff --check "$base" HEAD
          if git diff --name-only "$base" HEAD -- codex/codex-rs/app-server | grep -q .; then
            echo "Changes to codex/codex-rs/app-server are outside this project boundary." >&2
            exit 1
          fi

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-playwright-diagnostics
          if-no-files-found: ignore
          path: |
            desktop-app/test-results
            desktop-app/playwright-report

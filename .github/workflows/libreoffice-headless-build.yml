name: LibreOffice macOS headless experiment

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-intel:
    runs-on: macos-15-intel
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check native builder architecture
        shell: bash
        run: |
          test "$(uname -m)" = x86_64
          test -d /Applications/Xcode_16.4.app/Contents/Developer
          DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer xcodebuild -version

      - name: Install SHA-256-locked GNU Make bottle
        shell: bash
        run: |
          expected="$(jq -r '.bootstrapTools.gnuMake.bottleSha256["darwin-x64"]' primary-runtime/libreoffice-build.lock.json)"
          formula="$(brew info --json=v2 make | jq -r '.formulae[0].bottle.stable.files.sequoia.sha256')"
          test "$formula" = "$expected"
          brew fetch --force-bottle make
          bottle="$(brew --cache --force-bottle make)"
          actual="$(shasum -a 256 "$bottle" | cut -d ' ' -f 1)"
          test "$actual" = "$expected"
          brew install make
          gmake --version | head -1

      - name: Install source-locked Automake
        shell: bash
        run: |
          brew update
          expected_version="$(jq -r '.bootstrapTools.automake.version' primary-runtime/libreoffice-build.lock.json)"
          expected_source="$(jq -r '.bootstrapTools.automake.sourceSha256' primary-runtime/libreoffice-build.lock.json)"
          formula="$(brew info --json=v2 automake)"
          actual_version="$(jq -r '.formulae[0].versions.stable' <<< "$formula")"
          actual_source="$(jq -r '.formulae[0].urls.stable.checksum' <<< "$formula")"
          echo "Automake formula version=$actual_version source-sha256=$actual_source"
          test "$actual_version" = "$expected_version"
          test "$actual_source" = "$expected_source"
          brew install automake
          test "$(aclocal --version | head -1)" = "aclocal (GNU automake) $expected_version"

      - name: Install source-locked gperf
        shell: bash
        run: |
          expected_version="$(jq -r '.bootstrapTools.gperf.version' primary-runtime/libreoffice-build.lock.json)"
          expected_source="$(jq -r '.bootstrapTools.gperf.sourceSha256' primary-runtime/libreoffice-build.lock.json)"
          formula="$(brew info --json=v2 gperf)"
          test "$(jq -r '.formulae[0].versions.stable' <<< "$formula")" = "$expected_version"
          test "$(jq -r '.formulae[0].urls.stable.checksum' <<< "$formula")" = "$expected_source"
          brew install gperf
          gperf --version | head -1

      - name: Download pinned upstream source
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/libreoffice-core.tar.gz" \
            https://codeload.github.com/LibreOffice/core/tar.gz/refs/tags/libreoffice-26.8.0.3

      - name: Build from checked source and record external dependencies
        shell: bash
        run: |
          node primary-runtime/scripts/build-libreoffice-headless.mjs \
            --target=darwin-x64 \
            --source-archive="$RUNNER_TEMP/libreoffice-core.tar.gz" \
            --output="$RUNNER_TEMP/libreoffice-build" \
            --jobs=3

      - name: Archive the experimental app and provenance
        if: success()
        shell: bash
        run: |
          tar -czf "$RUNNER_TEMP/libreoffice-darwin-x64-experiment.tar.gz" \
            -C "$RUNNER_TEMP/libreoffice-build" \
            LibreOffice.app source-build-report.json
          shasum -a 256 "$RUNNER_TEMP/libreoffice-darwin-x64-experiment.tar.gz" \
            | tee "$RUNNER_TEMP/libreoffice-darwin-x64-experiment.sha256"

      - name: Retain experimental build for local restricted validation
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: libreoffice-darwin-x64-experiment
          path: |
            ${{ runner.temp }}/libreoffice-darwin-x64-experiment.tar.gz
            ${{ runner.temp }}/libreoffice-darwin-x64-experiment.sha256
          retention-days: 7

name: Desktop prerelease

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify desktop
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop-app/package-lock.json
            desktop-app/vendors/ai-sdk-provider-codex-asp/package-lock.json

      - name: Install provider dependencies
        run: npm ci
        working-directory: desktop-app/vendors/ai-sdk-provider-codex-asp

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop-app

      - name: Use locked Codex CLI
        shell: bash
        run: |
          echo "$GITHUB_WORKSPACE/desktop-app/node_modules/.bin" >> "$GITHUB_PATH"
          node desktop-app/scripts/verify-pinned-codex-cli.mjs

      - name: Build AI-free Codex app-server client
        run: npm run build:codex-app-server-client
        working-directory: desktop-app

      - name: Verify generated Codex app-server protocol contract
        run: npm run verify:codex-app-server-protocol-contract
        working-directory: desktop-app

      - name: Smoke-test real Codex app-server contract
        run: npm run verify:real-codex-app-server-contract
        working-directory: desktop-app

      - name: Verify native Codex runtime boundaries
        shell: bash
        working-directory: desktop-app
        run: |
          set -o pipefail
          mkdir -p test-results/contracts
          node scripts/verify-codex-native-runtime-boundaries.mjs | tee test-results/contracts/native-runtime-boundaries.json

      - name: Upload native runtime boundary report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-runtime-boundaries
          if-no-files-found: warn
          path: desktop-app/test-results/contracts/native-runtime-boundaries.json

      - name: Provider lint, typecheck, and tests
        working-directory: desktop-app/vendors/ai-sdk-provider-codex-asp
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Desktop lint, typecheck, and tests
        working-directory: desktop-app
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Enable Codex workspace sandbox on Linux
        shell: bash
        run: |
          if sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl -a 2>/dev/null | grep -q '^kernel.unprivileged_userns_clone'; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

      - name: Verify test-plan coverage contract
        run: xvfb-run --auto-servernum npm --prefix desktop-app run test:plan-coverage

      - name: Run Mock E2E
        run: xvfb-run --auto-servernum npm --prefix desktop-app run test:e2e -- --reporter=line

      - name: Run packaged smoke
        run: xvfb-run --auto-servernum npm --prefix desktop-app run test:e2e:packaged

      - name: Run release LLM E2E
        env:
          DASCOWORK_RELEASE_LLM_SMOKE: ${{ secrets.DASCOWORK_RELEASE_LLM_SMOKE }}
          DASCOWORK_RELEASE_ADMIN_BACKEND_URL: ${{ secrets.DASCOWORK_RELEASE_ADMIN_BACKEND_URL }}
          DASCOWORK_RELEASE_ADMIN_BACKEND_USER_ID: ${{ secrets.DASCOWORK_RELEASE_ADMIN_BACKEND_USER_ID }}
          DASCOWORK_RELEASE_EXTERNAL_RETRY: ${{ secrets.DASCOWORK_RELEASE_EXTERNAL_RETRY }}
        run: xvfb-run --auto-servernum npm --prefix desktop-app run test:e2e:release-llm

      - name: Check change scope
        shell: bash
        run: |
          base="$(git rev-parse HEAD^)"
          git diff --check "$base" HEAD
          if git diff --name-only "$base" HEAD -- codex/codex-rs/app-server | grep -q .; then
            echo "Changes to codex/codex-rs/app-server are outside this project boundary." >&2
            exit 1
          fi

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-playwright-diagnostics
          if-no-files-found: ignore
          path: |
            desktop-app/test-results
            desktop-app/playwright-report

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x64 DMG
            os: macos-15-intel
            command: build:mac
            arch: x64
            smoke-kind: dmg
            artifact: desktop-macos-x64
            pattern: desktop-app/dist/*.dmg
          - name: macOS arm64 DMG
            os: macos-14
            command: build:mac
            arch: arm64
            smoke-kind: dmg
            artifact: desktop-macos-arm64
            pattern: desktop-app/dist/*.dmg
          - name: Windows x64 NSIS
            os: windows-latest
            command: build:win
            arch: x64
            smoke-kind: nsis
            artifact: desktop-windows-x64
            pattern: desktop-app/dist/*.exe
          - name: Linux x64 AppImage deb snap
            os: ubuntu-latest
            command: build:linux
            arch: x64
            smoke-kind: appimage
            artifact: desktop-linux-x64
            pattern: |
              desktop-app/dist/*.AppImage
              desktop-app/dist/*.deb
              desktop-app/dist/*.snap

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop-app/package-lock.json
            desktop-app/vendors/ai-sdk-provider-codex-asp/package-lock.json

      - name: Install provider dependencies
        run: npm ci
        working-directory: desktop-app/vendors/ai-sdk-provider-codex-asp

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop-app

      - name: Use locked Codex CLI
        shell: bash
        run: |
          echo "$GITHUB_WORKSPACE/desktop-app/node_modules/.bin" >> "$GITHUB_PATH"
          node desktop-app/scripts/verify-pinned-codex-cli.mjs

      - name: Build AI-free Codex app-server client
        run: npm run build:codex-app-server-client
        working-directory: desktop-app

      - name: Build installer
        run: npm run ${{ matrix.command }} -- --${{ matrix.arch }}
        working-directory: desktop-app

      - name: Enable Codex workspace sandbox on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes squashfs-tools
          if sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl -a 2>/dev/null | grep -q '^kernel.unprivileged_userns_clone'; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

      - name: Smoke-test Linux installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for kind in appimage deb snap; do
            xvfb-run --auto-servernum node scripts/run-installer-local-media-smoke.mjs \
              --kind "$kind" --arch "${{ matrix.arch }}"
          done
        working-directory: desktop-app

      - name: Smoke-test macOS or Windows installer
        if: runner.os != 'Linux'
        run: >-
          node scripts/run-installer-local-media-smoke.mjs
          --kind ${{ matrix.smoke-kind }} --arch ${{ matrix.arch }}
        working-directory: desktop-app

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ matrix.pattern }}

  release:
    name: Publish prerelease
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download installer artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: desktop-*
          merge-multiple: true

      - name: Verify release assets
        run: node desktop-app/scripts/verify-release-assets.mjs release-assets

      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: main-${{ github.sha }}
        shell: bash
        run: |
          release_notes="$(printf '%s\n\n%s\n\n%s\n' \
            "Automated test prerelease for commit ${GITHUB_SHA}." \
            "These installers are prebuilt test artifacts from the main branch. macOS builds are not notarized and Windows builds are not signed, so first launch may show operating system security prompts." \
            "This release includes SHA256SUMS for asset verification. It does not include API keys, Codex login state, or backend credentials. The installed app requires the user's local Codex CLI to be installed, logged in, and visible on PATH."
          )"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "$release_notes" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "$release_notes" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

          gh release upload "$RELEASE_TAG" release-assets/* --clobber

name: Desktop internal build

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify desktop
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop-app

      - name: Use locked Codex CLI
        shell: bash
        run: |
          echo "$GITHUB_WORKSPACE/desktop-app/node_modules/.bin" >> "$GITHUB_PATH"
          node desktop-app/scripts/verify-pinned-codex-cli.mjs

      - name: Prepare Codex workspace sandbox on Linux
        shell: bash
        run: bash desktop-app/scripts/prepare-codex-linux-sandbox.sh

      - name: Build AI-free Codex app-server client
        run: npm run build:codex-app-server-client
        working-directory: desktop-app

      - name: Verify generated Codex app-server protocol contract
        run: npm run verify:codex-app-server-protocol-contract
        working-directory: desktop-app

      - name: Smoke-test real Codex app-server contract
        run: npm run verify:real-codex-app-server-contract
        working-directory: desktop-app

      - name: Verify native Codex runtime boundaries
        shell: bash
        working-directory: desktop-app
        run: |
          set -o pipefail
          mkdir -p test-results/contracts
          node scripts/verify-codex-native-runtime-boundaries.mjs | tee test-results/contracts/native-runtime-boundaries.json

      - name: Verify App Tools release-gate specification
        run: npm run verify:app-tools-release-gate-spec
        working-directory: desktop-app

      - name: Verify Primary Runtime builder and feed contracts
        run: |
          npm --prefix primary-runtime test
          npm --prefix services/primary-runtime-feed test

      - name: Upload native runtime boundary report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-runtime-boundaries
          if-no-files-found: warn
          path: desktop-app/test-results/contracts/native-runtime-boundaries.json

      - name: AI-free client lint, typecheck, and tests
        run: npm --prefix vendors/codex-app-server-client run qa
        working-directory: desktop-app

      - name: Desktop lint, typecheck, and tests
        working-directory: desktop-app
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Verify test-plan coverage contract
        run: xvfb-run --auto-servernum npm --prefix desktop-app run test:plan-coverage

      - name: Run Mock E2E
        run: xvfb-run --auto-servernum npm --prefix desktop-app run test:e2e -- --reporter=line

      - name: Run packaged smoke
        run: xvfb-run --auto-servernum npm --prefix desktop-app run test:e2e:packaged

      - name: Check change scope
        shell: bash
        run: |
          base="$(git rev-parse HEAD^)"
          git diff --check "$base" HEAD
          if git diff --name-only "$base" HEAD -- codex/codex-rs/app-server | grep -q .; then
            echo "Changes to codex/codex-rs/app-server are outside this project boundary." >&2
            exit 1
          fi

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-playwright-diagnostics
          if-no-files-found: ignore
          path: |
            desktop-app/test-results
            desktop-app/playwright-report

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x64 DMG
            os: macos-15-intel
            command: build:mac
            arch: x64
            smoke-kind: dmg
            artifact: desktop-macos-x64
            pattern: desktop-app/dist/*.dmg
          - name: macOS arm64 DMG
            os: macos-14
            command: build:mac
            arch: arm64
            smoke-kind: dmg
            artifact: desktop-macos-arm64
            pattern: desktop-app/dist/*.dmg
          - name: Windows x64 NSIS
            os: windows-latest
            command: build:win
            arch: x64
            smoke-kind: nsis
            artifact: desktop-windows-x64
            pattern: desktop-app/dist/*.exe
          - name: Linux x64 AppImage deb snap
            os: ubuntu-latest
            command: build:linux
            arch: x64
            smoke-kind: appimage
            artifact: desktop-linux-x64
            pattern: |
              desktop-app/dist/*.AppImage
              desktop-app/dist/*.deb
              desktop-app/dist/*.snap

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop-app

      - name: Use locked Codex CLI
        shell: bash
        run: |
          echo "$GITHUB_WORKSPACE/desktop-app/node_modules/.bin" >> "$GITHUB_PATH"
          node desktop-app/scripts/verify-pinned-codex-cli.mjs

      - name: Prepare Codex workspace sandbox on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: bash desktop-app/scripts/prepare-codex-linux-sandbox.sh

      - name: Build AI-free Codex app-server client
        run: npm run build:codex-app-server-client
        working-directory: desktop-app

      - name: Disable Primary Runtime production configuration for engineering installer builds
        run: node scripts/write-primary-runtime-product-config.mjs --disabled
        working-directory: desktop-app

      - name: Build installer
        run: npm run ${{ matrix.command }} -- --${{ matrix.arch }}
        working-directory: desktop-app

      - name: Install Linux installer smoke dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get install --yes squashfs-tools

      - name: Smoke-test Linux installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for kind in appimage deb snap; do
            xvfb-run --auto-servernum node scripts/run-installer-local-media-smoke.mjs \
              --kind "$kind" --arch "${{ matrix.arch }}"
          done
        working-directory: desktop-app

      - name: Smoke-test macOS or Windows installer
        if: runner.os != 'Linux'
        run: >-
          node scripts/run-installer-local-media-smoke.mjs
          --kind ${{ matrix.smoke-kind }} --arch ${{ matrix.arch }}
        working-directory: desktop-app

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ matrix.pattern }}
